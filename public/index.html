<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Ring</title><style>body{margin:0;background:#0e1617;color:#e9e4d5;font:15px system-ui}main{max-width:980px;margin:auto;padding:32px}section{background:#152021;border:1px solid #ffffff18;border-radius:16px;padding:18px;margin:14px 0}input,select,button{box-sizing:border-box;background:#0d1716;border:1px solid #ffffff25;border-radius:8px;color:#eee;padding:10px;margin:4px}button{cursor:pointer;color:#ecd892}button:hover{border-color:#d9c37e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.muted{color:#aab5ab}.hide{display:none}</style><main><h1>◉ LIVING RING</h1><p class="muted">Raspberry Pi · Bun · SQLite 세계 서버</p><section id="login"><h2>접속</h2><input id="name" placeholder="플레이어 이름"><button onclick="login()">접속</button><p id="loginStatus"></p></section><div id="game" class="hide"><section><h2 id="char"></h2><p id="stats"></p><p id="notice" class="muted"></p></section><section><h2>생존</h2><div class="grid"><button onclick="act({kind:'move',delta:-.1})">← 이동</button><button onclick="act({kind:'move',delta:.1})">이동 →</button><button onclick="act({kind:'eat_food'})">식 섭취</button><button onclick="act({kind:'craft_food'})">식 제작</button><button onclick="act({kind:'plant_raw'})">재 심기</button></div></section><section><h2>전투</h2><select id="target"></select><select id="hand"><option value="scissors">가위</option><option value="rock">바위</option><option value="paper">보</option></select><input id="strength" type="number" min="0" max="100" value="50"><button onclick="attack()">공격</button><div id="defense"></div></section><section><h2>시설 · 주변</h2><input id="password" placeholder="시설 비밀번호"><button onclick="build()">현재 위치 시설 건설/진행</button><div id="world"></div></section><section><h2>성장</h2><div class="grid"><button onclick="act({kind:'upgrade',stat:'clothing'})">의 +1 · 식 20</button><button onclick="act({kind:'upgrade',stat:'scissors'})">가위 무 +1</button><button onclick="act({kind:'upgrade',stat:'rock'})">바위 무 +1</button><button onclick="act({kind:'upgrade',stat:'paper'})">보 무 +1</button></div></section></div></main><script>let player='',data;const $=id=>document.getElementById(id);async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('name').value})}),j=await r.json();if(j.playerId){localStorage.ha2player=j.playerId;player=j.playerId;load()}else $('loginStatus').textContent=j.error}async function act(body){let r=await fetch('/api/action',{method:'POST',headers:{'content-type':'application/json','x-ha2-player':player},body:JSON.stringify(body)}),j=await r.json();if(j.error){$('notice').textContent=j.error;return}$('notice').textContent='반영되었습니다.';data=j;render()}async function load(){let r=await fetch('/api/me?player='+encodeURIComponent(player)),j=await r.json();if(!j.character){$('loginStatus').textContent='운영자가 캐릭터를 배정해야 합니다.';return}data=j;$('login').classList.add('hide');$('game').classList.remove('hide');render()}function attack(){act({kind:'attack_character',targetId:$('target').value,hand:$('hand').value,strength:+$('strength').value})}function build(){act({kind:'build_facility',position:data.character.position,password:$('password').value})}function render(){let c=data.character,w=data.world;$('char').textContent=c.name;$('stats').textContent=`체력 ${Math.round(c.hp)}/${c.hp_max} · 좌표 ${c.position.toFixed(1)} · 재 ${c.raw} · 식 ${c.food} · 의 ${c.clothing} · 무 ${c.mu_scissors}/${c.mu_rock}/${c.mu_paper}`;$('target').innerHTML='<option value="">대상 선택</option>'+w.characters.map(x=>`<option value="${x.id}">${x.name} · HP ${Math.round(x.hp)} · ${x.position.toFixed(1)}</option>`).join('');$('defense').innerHTML=w.pendingAttacks.map(a=>`<p>피격 대응 <button onclick="act({kind:'defend',attackId:'${a.id}',hand:'scissors'})">가위</button><button onclick="act({kind:'defend',attackId:'${a.id}',hand:'rock'})">바위</button><button onclick="act({kind:'defend',attackId:'${a.id}',hand:'paper'})">보</button></p>`).join('');$('world').innerHTML=w.crops.map(x=>`<p>작물 ${x.position.toFixed(1)} ${Date.now()>=x.harvest_at?`<button onclick="act({kind:'harvest',cropId:'${x.id}'})">수확</button>`:'성장 중'}</p>`).join('')+w.drops.map(x=>`<p>드롭 재${x.raw}/식${x.food}<button onclick="act({kind:'collect_drop',dropId:'${x.id}'})">줍기</button></p>`).join('')+w.facilities.map(x=>`<p>시설 ${x.position.toFixed(1)} · ${Math.round(x.progress*100)}% · HP ${Math.round(x.hp)} · 주${x.joo}<button onclick="act({kind:'build_facility',position:${x.position},password:$('password').value})">진행</button><button onclick="act({kind:'repair_facility',facilityId:'${x.id}',raw:1})">수리</button><button onclick="act({kind:'upgrade_joo',facilityId:'${x.id}'})">주 강화</button></p>`).join('')}player=localStorage.ha2player||'';if(player)load()</script></html>
