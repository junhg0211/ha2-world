<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Ring · 운영</title><style>body{margin:0;background:#0e1617;color:#eee;font:15px system-ui}main{max-width:650px;margin:auto;padding:32px}section{background:#152021;border:1px solid #ffffff18;border-radius:16px;padding:20px;margin-top:18px}input,select,button{box-sizing:border-box;width:100%;padding:11px;margin:5px 0;background:#0d1716;border:1px solid #ffffff25;border-radius:8px;color:#eee}button{cursor:pointer;color:#ecd892}small{color:#aab5ab}</style><main><a href="/" style="color:#d9c37e">← 게임으로</a><section><h1>운영자 대시보드</h1><p><small>운영자 키는 이 브라우저에서 요청을 보낼 때만 사용됩니다.</small></p><input id="key" type="password" placeholder="ADMIN_API_KEY"><hr><h2>초기 생명 배정</h2><input id="playerName" placeholder="플레이어 이름 (웹 접속 이름)"><input id="characterName" placeholder="캐릭터 이름"><select id="gender"><option value="female">여성</option><option value="male">남성</option></select><input id="position" type="number" value="0" placeholder="좌표"><input id="raw" type="number" value="0" placeholder="초기 재"><input id="food" type="number" value="0" placeholder="초기 식"><input id="clothing" type="number" value="0" placeholder="초기 의"><button onclick="createCharacter()">생명 조종권 배정</button><p id="result"></p></section></main><script>async function createCharacter(){let body={playerName:playerName.value.trim(),name:characterName.value.trim(),gender:gender.value,position:+position.value,raw:+raw.value,food:+food.value,clothing:+clothing.value};let res=await fetch('/api/admin/character',{method:'POST',headers:{'content-type':'application/json','x-ha2-admin-key':key.value},body:JSON.stringify(body)}),data=await res.json();result.textContent=res.ok?`배정 완료. 플레이어 ID: ${data.playerId}`:(data.error||'실패');}</script></html>
